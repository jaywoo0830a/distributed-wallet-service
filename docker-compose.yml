services:
  # --- Databases ---
  mysql:
    image: mysql:8.4
    container_name: wallet-db
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-wallet_service}
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 2s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wallet-network

  redis:
    image: redis:latest
    container_name: wallet-redis
    restart: always
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wallet-network

  # --- Bitcoin (Regtest Mode) ---
  bitcoind:
    build: ./docker/bitcoin
    container_name: wallet-bitcoind
    env_file: .env
    environment:
      BITCOIN_NETWORK: regtest
      BITCOIN_RPC_USER: ${BTC_RPC_USER:-devuser}
      BITCOIN_RPC_PASSWORD: ${BTC_RPC_PASS:-devpass}
    ports:
      - "18443:18443"
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-rpcuser=${BTC_RPC_USER:-devuser}", "-rpcpassword=${BTC_RPC_PASS:-devpass}", "-regtest", "getblockchaininfo"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks:
      - wallet-network

  # --- Monero (Testnet Mode) ---
  monerod:
    build: ./docker/monero/daemon
    container_name: wallet-monerod
    command: 
      --testnet 
      --p2p-bind-ip=0.0.0.0 
      --p2p-bind-port=28080 
      --rpc-bind-ip=0.0.0.0 
      --rpc-bind-port=28081 
      --non-interactive 
      --confirm-external-bind
      --restricted-rpc
    ports:
      - "28080:28080"
      - "28081:28081"
    volumes:
      - monero_data:/data
    networks:
      - wallet-network

  monero-wallet:
    build: ./docker/monero/wallet
    container_name: wallet-monero-rpc
    depends_on:
      - monerod
    env_file: .env
    environment:
      MONERO_NETWORK: testnet
      MONEROD_HOST: monerod
      MONEROD_RPC_PORT: 28081
      WALLET_RPC_PORT: 28083
      MONERO_WALLET_PASSWORD: ${XMR_RPC_PASS:-devpass}
    ports:
      - "28083:28083"
    volumes:
      - monero_wallet_data:/wallet
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "28083"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks:
      - wallet-network

  # --- API Service ---
  api:
    build: .
    container_name: wallet-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      bitcoind:
        # In mock mode, bitcoind and monero-wallet might not be healthy, 
        # but depends_on with conditions can block the API start.
        # We keep it as is, but users can comment these out in .env for pure mock mode.
        condition: service_healthy
      monero-wallet:
        condition: service_healthy
    env_file: .env
    environment:
      - NODE_ENV=development
      - WALLET_MODE=${WALLET_MODE:-live} # Default to live
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "3000:3000"
    networks:
      - wallet-network

  nginx:
    image: nginx:latest
    container_name: wallet-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - wallet-network

networks:
  wallet-network:
    name: wallet-network
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  bitcoin_data:
  monero_data:
  monero_wallet_data: