services:
  api:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -lc "npm ci && npm run build && npm run migrate && npm run start"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://wallet:wallet@mysql:3306/wallet_api
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - mysql
      - redis

  worker:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -lc "npm ci && npm run build && npm run migrate && npm run worker"
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://wallet:wallet@mysql:3306/wallet_api
      REDIS_URL: redis://redis:6379
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4.0
    environment:
      MYSQL_DATABASE: wallet_api
      MYSQL_USER: wallet
      MYSQL_PASSWORD: wallet
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

volumes:
  mysql_data:
