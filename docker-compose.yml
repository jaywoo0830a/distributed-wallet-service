services:
  # --- Databases ---
  mysql:
    image: mysql:8.4
    container_name: wallet-db
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 2s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wallet-network

  redis:
    image: redis:latest
    container_name: wallet-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - wallet-network

  # --- Bitcoin (Regtest Mode) ---
  bitcoind:
    build: ./docker/bitcoin
    container_name: wallet-bitcoind
    env_file: .env
    environment:
      BITCOIN_NETWORK: regtest
      BITCOIN_RPC_USER: ${BTC_RPC_USER:?BTC_RPC_USER is required}
      BITCOIN_RPC_PASSWORD: ${BTC_RPC_PASS:?BTC_RPC_PASS is required}
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    healthcheck:
      # Credentials are read from the container's bitcoin.conf via BITCOIN_* env,
      # not passed on the command line, to avoid leaking via `docker inspect`.
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=$$BITCOIN_RPC_USER -rpcpassword=$$BITCOIN_RPC_PASSWORD getblockchaininfo >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks:
      - wallet-network

  # --- Monero (Testnet Mode) ---
  monerod:
    build: ./docker/monero/daemon
    container_name: wallet-monerod
    command:
      --testnet
      --p2p-bind-ip=0.0.0.0
      --p2p-bind-port=28080
      --rpc-bind-ip=0.0.0.0
      --rpc-bind-port=28081
      --non-interactive
      --confirm-external-bind
      --restricted-rpc
      --prune-blockchain
    volumes:
      - monero_data:/data
    networks:
      - wallet-network

  monero-wallet:
    build: ./docker/monero/wallet
    container_name: wallet-monero-rpc
    depends_on:
      - monerod
    env_file: .env
    environment:
      MONERO_NETWORK: testnet
      MONEROD_HOST: monerod
      MONEROD_RPC_PORT: 28081
      WALLET_RPC_PORT: 28083
      MONERO_WALLET_PASSWORD: ${XMR_RPC_PASS:?XMR_RPC_PASS is required}
    volumes:
      - monero_wallet_data:/wallet
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "28083"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks:
      - wallet-network

  # --- API Service ---
  # Base definition is production-like: no host port exposure, no source mount,
  # no dev command. Dev override adds those back on loopback only.
  api:
    build: .
    container_name: wallet-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      bitcoind:
        condition: service_started
      monero-wallet:
        condition: service_started
    env_file: .env
    networks:
      - wallet-network

  nginx:
    image: nginx:latest
    container_name: wallet-nginx
    ports:
      # HTTP_PORT lets you co-host multiple sites on one server by mapping
      # nginx to a non-default host port (e.g. 8080, 8081, ...).
      - "${HTTP_PORT:?HTTP_PORT is required}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - wallet-network

networks:
  wallet-network:
    name: wallet-network
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  bitcoin_data:
  monero_data:
  monero_wallet_data:
