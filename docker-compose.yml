services:
  # --- Databases ---
  mysql:
    image: mysql:8.4
    container_name: wallet-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wallet_service
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: wallet-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --- Bitcoin (Regtest Mode) ---
  bitcoind:
    build: ./docker/bitcoin
    container_name: wallet-bitcoind
    environment:
      BITCOIN_NETWORK: regtest
      BITCOIN_RPC_USER: devuser
      BITCOIN_RPC_PASSWORD: devpass
    ports:
      - "18443:18443" # Regtest RPC
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin

  # --- Monero (Testnet Mode) ---
  # Note: Running a node takes time/space. Using --testnet for dev.
  monerod:
    build: ./docker/monero/daemon
    container_name: wallet-monerod
    # Command flags to bind to all interfaces so other containers can access it
    command: ["/opt/monero/monerod", "--testnet", "--p2p-bind-ip=0.0.0.0", "--p2p-bind-port=28080", "--rpc-bind-ip=0.0.0.0", "--rpc-bind-port=28081", "--non-interactive", "--confirm-external-bind"]
    ports:
      - "28080:28080"
      - "28081:28081"
    volumes:
      - monero_data:/data

  monero-wallet:
    build: ./docker/monero/wallet
    container_name: wallet-monero-rpc
    depends_on:
      - monerod
    environment:
      MONERO_NETWORK: testnet
      MONEROD_HOST: monerod
      MONEROD_RPC_PORT: 28081
      WALLET_RPC_PORT: 28083
      MONERO_WALLET_PASSWORD: devpass
    ports:
      - "28083:28083"
    volumes:
      - monero_wallet_data:/wallet

  # --- API Service ---
  api:
    build: .
    container_name: wallet-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      bitcoind:
        condition: service_started
      monero-wallet:
        condition: service_started
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=wallet_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # Bitcoin RPC Config (Connects to 'bitcoind' container)
      - BTC_RPC_URL=http://bitcoind:18443
      - BTC_RPC_USER=devuser
      - BTC_RPC_PASS=devpass
      
      # Monero RPC Config (Connects to 'monero-wallet' container)
      - XMR_RPC_URL=http://monero-wallet:28083/json_rpc
      - XMR_RPC_USER=monero
      - XMR_RPC_PASS=devpass
      
    # Sync host files and node_modules to container for hot-reloading
    volumes:
      - .:/app
    # Use nodemon for development
    command: npm run dev
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    container_name: wallet-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

# Define volumes at the top level
volumes:
  mysql_data:
  redis_data:
  bitcoin_data:
  monero_data:
  monero_wallet_data: