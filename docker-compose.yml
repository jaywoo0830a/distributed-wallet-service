services:
  mysql:
    image: mysql:8.4
    container_name: wallet-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wallet_service
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    # Add volume for MySQL data persistence
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: wallet-redis
    restart: always
    ports:
      - "6379:6379"
    # Add volume for Redis data persistence
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: wallet-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=wallet_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    # Sync host files and node_modules to container for hot-reloading
    volumes:
      - .:/app
    # Use nodemon for development
    command: npm run dev
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    container_name: wallet-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

# Define volumes at the top level
volumes:
  mysql_data:
  redis_data: