# Development overrides.
# All host port mappings are bound to 127.0.0.1 so they are reachable from the
# developer's workstation only, never from the LAN or the public internet.
services:
  mysql:
    ports:
      - "127.0.0.1:13306:3306"

  redis:
    ports:
      - "127.0.0.1:16379:6379"

  bitcoind:
    ports:
      - "127.0.0.1:18443:18443"

  monerod:
    ports:
      - "127.0.0.1:28080:28080"
      - "127.0.0.1:28081:28081"

  monero-wallet:
    ports:
      - "127.0.0.1:28083:28083"

  api:
    environment:
      - NODE_ENV=development
      - WALLET_MODE=${WALLET_MODE:-mock}
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
